openapi: 3.1.0
info:
  title: API für IQB-ResponseAnalyser
  version: 0.4.0-draft.2
  description: 'Entwurf als Folgeänderung zu API-PR #1: Item Matrix Rules 0.1 als gemeinsame Konfiguration
    und atomarer Bulk-Upload. Interner ResponseAnalyser ohne Frontend, Authentifizierung oder Rollenmodell.
    Erste Ausbaustufe: eine Dienstinstanz, persistente Workspace-Definitionen, keine dauerhafte Speicherung
    von Personenantworten oder Ergebnissen. Spätere Skalierung wird durch getrennte Verarbeitung und Speicherung
    vorbereitet, ist kein Abnahmekriterium dieser Stufe. Der Aufrufer verantwortet Personenbezug und Ergebnisspeicherung.
    Der Dienst besitzt kein Messzeitpunktmodell; fachlich verschiedene Skalen werden durch unterschiedliche
    scaleId unterschieden.

    Rechenprofil mean-v1: Alle Basismethoden einschließlich WLE und CODE_COUNT bilden vorläufig den ungewichteten
    arithmetischen Mittelwert verwendbarer Item-Scores. Alle Derived-Methoden bilden den Mittelwert verwendbarer
    Quellskalenwerte; MAP benutzt ausschließlich sources[0]. Methodenparameter, Itemgewichte und Mappingtabellen
    beeinflussen in dieser Stufe die Berechnung nicht. Es findet noch keine WLE-Schätzung, Codezählung, Summen-
    oder Tabellenabbildung statt. Die definierte Methode bleibt für spätere Ausbaustufen erhalten. Jedes Ergebnis
    nennt das Rechenprofil ausdrücklich.'
  contact:
    name: Tech Support
    email: iqb-tbadev-support@hu-berlin.de
  license:
    name: CC0
    url: https://creativecommons.org/publicdomain/zero/1.0/deed.en
servers:
- url: https://www.iqb-responseanalyser.de/
  description: Beispiel
tags:
- name: admin
  description: Verwaltung von Arbeitsbereichen
- name: manage-content
  description: Hochladen/Löschen von Assessment Content
- name: evaluate
  description: Testergebnisse kodieren und analysieren
paths:
  /:
    put:
      tags:
      - admin
      summary: Anlegen Arbeitsbereich
      description: Legt ohne Request-Body einen namenlosen Workspace mit effektiver Defaultkonfiguration an
        und liefert dessen ID zurück. Es gibt keinen Workspace-State und keine Freigabeoperation.
      operationId: putWorkspace
      responses:
        '200':
          description: Arbeitsbereich angelegt
          content:
            text/plain:
              schema:
                type: number
              example: 365
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /{workspaceId}:
    get:
      tags:
      - admin
      summary: Allgemeine Daten des Arbeitsbereiches werden abgefragt.
      description: Abruf von Unitliste und Skalenliste. Workspaces besitzen weder Namen noch Lifecycle-State
        und werden ausschließlich über workspaceId adressiert.
      operationId: getWorkspaceInfo
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      responses:
        '200':
          description: Workspace-Info erfolgreich abgerufen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - admin
      summary: Workspace löschen
      operationId: deleteWorkspace
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      description: 'Löscht Workspace samt Definitionen, Aliaszuordnungen und Konfiguration atomar. Der Aufrufer
        schließt zuvor alte Aufträge einschließlich Ergebnisspeicherung ab oder verwirft sie verbindlich. Unbekannte
        ID: 404.'
      responses:
        '200':
          description: Operation erfolgreich
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /{workspaceId}/upload-unit:
    post:
      tags:
      - manage-content
      summary: Hochladen des Kodierschemas und der Itemliste einer Unit
      operationId: uploadUnitData
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnitUpload'
      responses:
        '200':
          description: Daten hochgeladen
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      description: Definitionen ersetzen vorhandene Daten gleicher ID atomar. Vorwärtsreferenzen sind zulässig.
        Der Aufrufer koordiniert den vollständigen Import und startet währenddessen keine Auswertungen. Fachliche
        Abhängigkeiten werden bei der Auswertung geprüft.
  /{workspaceId}/upload-scale-base:
    post:
      tags:
      - manage-content
      summary: Hochladen einer Skalendefinition - Basis-Skala
      operationId: uploadScaleBase
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: https://w3id.org/iqb/spec/acp-scale-base/0.4
      responses:
        '200':
          description: Daten hochgeladen
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      description: Definitionen ersetzen vorhandene Daten gleicher ID atomar. Vorwärtsreferenzen sind zulässig.
        Der Aufrufer koordiniert den vollständigen Import und startet währenddessen keine Auswertungen. Fachliche
        Abhängigkeiten werden bei der Auswertung geprüft. Basis- und abgeleitete Skalen teilen einen ID-Namensraum;
        ein Typwechsel einer vorhandenen Skala wird als INVALID_PARAMETER abgewiesen.
  /{workspaceId}/upload-scale-derived:
    post:
      tags:
      - manage-content
      summary: Hochladen einer Skalendefinition - Abgeleitete Skala
      operationId: uploadScaleDerived
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: https://w3id.org/iqb/spec/acp-scale-derived/0.4
      responses:
        '200':
          description: Daten hochgeladen
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      description: Definitionen ersetzen vorhandene Daten gleicher ID atomar. Vorwärtsreferenzen sind zulässig.
        Der Aufrufer koordiniert den vollständigen Import und startet währenddessen keine Auswertungen. Fachliche
        Abhängigkeiten werden bei der Auswertung geprüft. Basis- und abgeleitete Skalen teilen einen ID-Namensraum;
        ein Typwechsel einer vorhandenen Skala wird als INVALID_PARAMETER abgewiesen.
  /{workspaceId}/delete-unit/{unitId}:
    delete:
      tags:
      - manage-content
      summary: Löschen von Unit-Daten
      operationId: deleteUnitData
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/UnitId'
      responses:
        '200':
          description: Daten löschen
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      description: Löscht die bezeichnete Definition atomar. Der Aufrufer koordiniert Inhaltsänderungen und
        laufende Auswertungen.
  /{workspaceId}/delete-scale/{scaleId}:
    delete:
      tags:
      - manage-content
      summary: Löschen von Skalendaten
      operationId: deleteScale
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/ScaleId'
      responses:
        '200':
          description: Daten löschen
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      description: Löscht die bezeichnete Definition atomar. Der Aufrufer koordiniert Inhaltsänderungen und
        laufende Auswertungen.
  /{workspaceId}/evaluate:
    post:
      tags:
      - evaluate
      summary: Kodieren und analysieren der Daten einer Testperson
      description: 'Verarbeitet eine Person ohne dauerhafte Speicherung. Der Request verwendet einen konsistenten
        Workspace-Inhalt.

        1. Antworten pro unitAlias kodieren. Coding Scheme wird unverändert an den Autocoder weitergegeben.

        2. Explizite oder automatische Itemzuordnung anwenden; itemMatrixRules zur Code/Score-Umsetzung anwenden.
        Ein Rohantwortwert wird nie ersatzweise als Score verwendet.

        3. Zusatzitems mit berechneten Items zusammenführen: berechneter Eintrag gewinnt vollständig.

        4. Relevante Skalen bestimmen. Keine zugeordneten Itemeinträge: Basisskala weglassen. Relevante Skalen
        mit ausschließlich Missing-Items bleiben relevant und werden mit Fehlerstatus berichtet.

        5. mean-v1 berechnen: jede Basismethode = ungewichteter Mittelwert verwendbarer Scores; in missingScores
        aufgeführte Item-Scores nicht mitzählen. minItemNumber zählt verwendbare Scores, einschließlich gültiger
        0. Unterhalb der Mindestanzahl oder ohne einen verwendbaren Score: INSUFFICIENT_SOURCE. Der Mindestwert
        0 hebt nur die Anzahlbeschränkung auf, erlaubt keine Mittelwertbildung über eine leere Liste.

        6. Derived: zuerst berechnete Quellresultate verwenden, sonst Zusatzskalenwerte. MAP verwendet nur
        die erste Quelle; deren Mittelwert ist ihr Wert selbst. SUM und MEAN verwenden vorläufig beide den
        ungewichteten Mittelwert aller erforderlichen Quellen. Zu wenige gültige Quellwerte: INSUFFICIENT_SOURCE.
        Ein berechnetes Fehlerresultat wird nie durch einen kollidierenden Zusatzwert ersetzt.

        7. Alle relevanten Skalen berichten. Vorschlag für Fehlerabgrenzung: fehlerhafte Definition oder effektiver
        Zyklus = SCALE_DEF_ERROR; bei korrekter Definition zu wenige verwendbare Items/Quellen = INSUFFICIENT_SOURCE;
        sonst ein nicht durch itemMatrixRules behandelbarer Kodierfehler = CODING_ERROR. VALID enthält value;
        Fehler enthalten kein value. Ein Nicht-Erfolgsstatus gilt niemals als numerischer Quellwert.

        Die extern referenzierten Skalenformate bleiben erhalten, ihre spätere methodenspezifische Auswertung
        wird durch das ausdrücklich ausgewiesene Profil mean-v1 vorläufig ersetzt. Methodenparameter und Gewichte
        werden gespeichert, aber nicht für die Mittelwertbildung verwendet. Keine WLE-Parameterpflicht oder
        Ratio-Nennerprüfung in dieser Stufe; Struktur und effektive Abhängigkeiten werden weiterhin geprüft.
        Der Aufrufer verhindert Überschneidungen zwischen mehrteiligen Imports und Auswertungen; der Dienst
        erzwingt hierfür keinen Workspace-State.'
      operationId: evaluateResponses
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluationInput'
      responses:
        '200':
          description: Kodierte Antworten, zusammengeführte Itemwerte und relevante Skalenresultate im Rechenprofil
            mean-v1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationOutput'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /{workspaceId}/configuration:
    get:
      tags:
      - admin
      summary: Effektive Konfiguration lesen
      operationId: getWorkspaceConfiguration
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      description: Liefert itemMatrixRules einschließlich effektiver Defaults.
      responses:
        '200':
          description: Operation erfolgreich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceConfiguration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    put:
      tags:
      - admin
      summary: Konfiguration ersetzen
      operationId: putWorkspaceConfiguration
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      description: Ersetzt die Konfiguration atomar; nicht angegebene Werte werden auf Defaults zurückgesetzt.
        Kein Merge mit der früheren Konfiguration. Der Aufrufer koordiniert die Änderung mit laufenden Auswertungen.
      responses:
        '200':
          description: Operation erfolgreich
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceConfiguration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkspaceConfiguration'
  /{workspaceId}/reset:
    post:
      tags:
      - admin
      summary: Workspace-Inhalt vollständig leeren
      operationId: resetWorkspace
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      description: Löscht Units, Aliase und Skalen atomar und setzt die Konfiguration auf Defaults zurück.
        Die Workspace-ID bleibt erhalten. Wiederholbar. Der Aufrufer koordiniert alte Ergebnisse und startet
        bis zum abgeschlossenen Neuimport keine Auswertungen.
      responses:
        '200':
          description: Operation erfolgreich
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /{workspaceId}/upload-content:
    post:
      tags:
      - manage-content
      operationId: uploadContentBulk
      summary: Units, Skalen und Konfiguration gemeinsam hochladen
      description: 'Synchroner atomarer Bulk-Upload. Zunächst den gesamten Request validieren, dann alle Änderungen
        in einer Transaktion übernehmen. Jeder Fehler verwirft den gesamten Upload; keine Teilerfolge und kein
        207. Definitionen gleicher ID werden ersetzt; nicht gelieferte Definitionen bleiben bestehen. configuration
        wird bei Angabe vollständig ersetzt, bei Weglassen unverändert belassen. Mehrfach genannte Unit-IDs
        und mehrfach genannte Skalen-IDs (auch über baseScales/derivedScales hinweg) sind INVALID_PARAMETER.
        Basis- und abgeleitete Skalen teilen einen ID-Namensraum; der Wechsel des Typs einer vorhandenen Skala
        wird mit INVALID_PARAMETER abgewiesen. Aliase werden gegen den resultierenden Workspace geprüft, einschließlich
        unveränderter Units; gleichzeitige Aliaswechsel werden anhand des Endzustands geprüft. Vorwärtsreferenzen
        innerhalb und außerhalb des Pakets bleiben wie bei Einzeluploads erlaubt; fachliche Abhängigkeiten
        werden bei Evaluate geprüft. Identische Wiederholungen ohne zwischenzeitliche Änderungen erzeugen denselben
        Definitionsstand. Zeitgleich gestartete Auswertungen sehen einen vollständigen alten oder neuen Stand,
        niemals einen Teilimport. Der Aufrufer koordiniert weiterhin die Zuordnung alter Ergebnisse. Ein Import
        über mehrere Requests ist nicht atomar. Bei Überschreitung der vom Betreiber dokumentierten Request-Größenbegrenzung:
        413 ohne Änderungen. Ein Timeout kann nach erfolgreichem Commit auftreten und bestätigt keinen Rollback.
        Fehlerdetails können issues mit path (JSON Pointer), code und message enthalten, z. B. /units/1/aliases/0;
        keine Antwortdaten in Fehlermeldungen.'
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkContentUpload'
            example: &id001
              units:
              - id: U1
                codingScheme:
                  version: '3.4'
                  variableCodings: []
              baseScales:
              - id: B1
                method: SCORE_MEAN
                items:
                - id: U1v1
              derivedScales:
              - id: D1
                name:
                - lang: de
                  value: Abgeleitete Skala
                method: MAP
                sources:
                - B1
              configuration:
                itemMatrixRules:
                  missingElse:
                    code: 0
                    score: -99
      responses:
        '200':
          description: Gesamtes Paket übernommen. Zähler beziehen sich auf den Request, nicht den Gesamtbestand.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkContentUploadResult'
              example:
                units: 1
                baseScales: 1
                derivedScales: 1
                configurationUpdated: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
        '413':
          description: Request zu groß; keine Änderungen übernommen.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                code: PAYLOAD_TOO_LARGE
                message: Upload überschreitet die konfigurierte Größenbegrenzung.
components:
  parameters:
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
        example: 354
      description: Eindeutige Kennung für den Arbeitsbereich
    UnitId:
      name: unitId
      in: path
      required: true
      schema:
        type: string
        example: GZ88827a
      description: Eindeutige Kennung für eine Unit
    ScaleId:
      name: scaleId
      in: path
      required: true
      schema:
        type: string
        example: iqb.bista-primar-de.2027
      description: Eindeutige Kennung für eine Skala
  schemas:
    WorkspaceInfo:
      type: object
      properties:
        units:
          type: array
          description: List of units with data in this workspace
          items:
            type: object
            properties:
              id:
                type: string
              hasCodingScheme:
                type: boolean
                default: false
              hasItemlist:
                type: boolean
                default: false
            required:
            - id
        Scales:
          type: array
          description: List of scales in this workspace
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              type:
                type: string
            required:
            - id
            - type
      required:
      - units
      - Scales
      additionalProperties: false
    Items:
      description: Explizite Itemzuordnung. useUnitAliasAsPrefix default true. Diese Liste hat Vorrang vor
        automatischer Itembenennung; deren drei Sonderregeln gelten hier nicht.
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          useUnitAliasAsPrefix:
            description: If true, the unique item identifier will be composed of the unit alias and the item
              id. If false, the item id has no prefix.
            type: boolean
            default: true
          name:
            type: string
          sourceVariable:
            description: Refers to the variable providing its score as item value
            type: string
        additionalProperties: false
        required:
        - id
        - sourceVariable
    unitResponses:
      type: object
      properties:
        unitAlias:
          type: string
        responses:
          type: array
          items:
            $ref: https://w3id.org/iqb/spec/response/2.0
          minItems: 1
          example:
          - id: M23441_2
            status: INVALID
            value: 4
          - id: M23441_3
            status: CODING_COMPLETE
            value: wunderbAre Sache!
            code: 0
            score: 0
      additionalProperties: false
      required:
      - unitAlias
      - responses
    itemValues:
      type: array
      items:
        type: object
        properties:
          id:
            type: string
          code:
            type: integer
          score:
            type: integer
        required:
        - id
        - code
        - score
        additionalProperties: false
      example:
      - id: M23441a
        code: 1
        score: -99
      - id: M23441b
        code: 23
        score: 0
      - id: M23441c
        code: 1
        score: 1
    EvaluationInput:
      description: Alle verfügbaren Antworten und optional zusätzliche Item-/Skalenwerte einer Person. Keine
        Personen-ID und keine Messzeitpunktinformation. Unterschiedliche fachliche Skalen werden ausschließlich
        durch unterschiedliche scaleId unterschieden. Berechnete Items haben bei gleicher id vollständig Vorrang
        vor Zusatzitems. Berechnete Skalenresultate haben bei gleicher scaleId auch im Fehlerfall Vorrang vor
        Zusatzwerten; es erfolgt kein feldweises Zusammenführen und kein Ersatz eines Fehlers durch den Zusatzwert.
        Doppelte IDs innerhalb einer Zusatzliste oder doppelte automatische Item-IDs werden abgewiesen. Ohne
        responses sind Anfragen nur mit Zusatzwerten möglich. Eine leere Eingabe liefert leere Ergebnislisten.
      type: object
      properties:
        responses:
          type: array
          items:
            $ref: '#/components/schemas/unitResponses'
          minItems: 1
        addOnItems:
          $ref: '#/components/schemas/itemValues'
        addOnScaleValues:
          description: Zusätzliche numerische Quellskalenwerte; keine Messzeitpunkt-Metadaten. Bei Namenskonflikt
            hat ein ermitteltes Skalenresultat Vorrang, auch mit Fehlerstatus. Diese Werte dienen als Quellen
            und werden nicht allein deshalb als eigene berechnete Ergebnisse ausgegeben.
          type: array
          items:
            type: object
            properties:
              scaleId:
                type: string
              value:
                type: number
            required:
            - scaleId
            - value
            additionalProperties: false
      additionalProperties: false
      example:
        responses:
        - responses:
          - id: '2'
            status: VALUE_CHANGED
            value: 4
          - id: '3'
            status: VALUE_CHANGED
            value: wunderbAre Sache!
          - id: aac
            status: CODING_COMPLETE
            value:
            - 4
            - 5
            - 7
            - 1
            code: 3
            score: 1
          unitAlias: M28347
        addOnItems:
        - id: K3445
          code: 2
          score: 1
        - id: K3335
          code: 5
          score: -99
        - id: K0445
          code: 0
          score: 0
    EvaluationOutput:
      type: object
      properties:
        codedResponses:
          description: Alle beim Aufruf übergebenen Antworten werden kodiert zurückgegeben.
          type: array
          items:
            $ref: '#/components/schemas/unitResponses'
          example:
          - responses:
            - id: '2'
              status: INVALID
              value: 4
            - id: '3'
              status: CODING_COMPLETE
              value: wunderbAre Sache!
              code: 0
              score: 0
            unitAlias: M28347
        itemValues:
          $ref: '#/components/schemas/itemValues'
        scaleValues:
          type: array
          items:
            $ref: '#/components/schemas/ScaleResult'
          description: Relevanz und Berechenbarkeit sind getrennt. Eine Basisskala ohne irgendeinen zugeordneten
            Itemeintrag in der zusammengeführten Itemliste wird nicht berichtet. Auch ein Itemeintrag mit MISSING
            begründet Relevanz; er liefert jedoch keinen verwendbaren Score. Alle relevanten Skalen werden
            mit VALID und value oder einem Fehlerstatus ohne value berichtet. Derived-Relevanz entsteht durch
            mindestens eine relevante effektive Quellskala oder einen zusätzlich gelieferten effektiven Quellwert;
            ohne jede solche Quelle entfällt die Skala. Für MAP ist ausschließlich sources[0] effektiv, weitere
            Quellen werden nicht ausgewertet, begründen keine Relevanz und keine Mindestanforderung. Für andere
            Derived-Methoden sind alle aufgeführten Quellen erforderlich. Relevanz wird entlang der effektiven
            Abhängigkeiten fortgepflanzt. Reine Zusatzskalen werden nicht als berechnete Resultate durchgereicht.
          example:
          - scaleId: base.example
            status: VALID
            value: 3
          - scaleId: derived.example
            status: INSUFFICIENT_SOURCE
        calculationProfile:
          type: string
          const: mean-v1
          description: Explizites vorläufiges Rechenprofil. Insbesondere keine fachlich differenzierte WLE-,
            SUM-, CODE_COUNT- oder MAP-Berechnung.
      additionalProperties: false
      required:
      - calculationProfile
      - codedResponses
      - itemValues
      - scaleValues
    Error:
      type: object
      properties:
        code:
          type: string
          description: Fehlercode für programmatische Behandlung
        message:
          type: string
          description: Menschenlesbare Fehlermeldung
        details:
          type: object
          description: Zusätzliche Fehlerdetails
      required:
      - code
      - message
    WorkspaceConfiguration:
      type: object
      additionalProperties: false
      properties:
        itemMatrixRules:
          $ref: '#/components/schemas/ItemMatrixRules'
        missingScores:
          type: array
          items:
            type: integer
          uniqueItems: true
          default:
          - -99
          description: Explizit reservierte Missing-Scores für Itemwerte; Default [-99]. Nur diese Zahlen werden
            aus mean-v1 ausgeschlossen, unabhängig von Code und Herkunft (berechnet oder zusätzlich). Andere
            negative Scores sind gültig. [] deaktiviert den Ausschluss. Wer weitere Missing-Codes wie -98 verwendet,
            muss sie hier eintragen. Die Statusumsetzung durch itemMatrixRules klassifiziert einen Score nicht
            automatisch als Missing. Gilt nicht für Skalenwerte. Feld gehört zur API-Auswertungskonfiguration,
            nicht zum externen Item-Matrix-Schema.
      default:
        itemMatrixRules:
          itemNaming:
            separator: ''
            omitUnitAliasIfVariableIdLongerThan: 0
            useUnitAliasIfSingleVariable: false
          missingsMap: []
          missingElse:
            code: 0
            score: -99
        missingScores:
        - -99
      example:
        itemMatrixRules:
          itemNaming:
            separator: ''
            omitUnitAliasIfVariableIdLongerThan: 0
            useUnitAliasIfSingleVariable: false
          missingsMap: []
          missingElse:
            code: 0
            score: -99
        missingScores:
        - -99
      description: Workspace-Konfiguration. Einzige Quelle für automatische Itembenennung und Statusumsetzung
        ist itemMatrixRules. codingParameters und separates itemNaming werden nicht mehr akzeptiert. PUT ersetzt
        vollständig; ausgelassene Felder und Unterfelder erhalten die dokumentierten Defaults, einschließlich
        missingsMap=[] und missingElse={code:0,score:-99}. GET und PUT liefern die effektive Konfiguration.
        JSON-Schema-Defaults werden durch die Anwendung angewandt. Reset stellt diese Defaults wieder her.
        missingScores steuert separat die Verwendbarkeit von Item-Scores; bei Weglassen gilt [-99], auch nach
        Reset.
    ScaleResult:
      type: object
      additionalProperties: false
      properties:
        scaleId:
          type: string
        status:
          type: string
          enum:
          - VALID
          - SCALE_DEF_ERROR
          - CODING_ERROR
          - INSUFFICIENT_SOURCE
        value:
          type: number
      required:
      - scaleId
      - status
      allOf:
      - if:
          properties:
            status:
              const: VALID
          required:
          - status
        then:
          required:
          - value
        else:
          not:
            required:
            - value
    UnitUpload:
      type: object
      properties:
        id:
          type: string
        aliases:
          type: array
          items:
            type: string
          uniqueItems: true
          description: Bei fehlender oder leerer Liste wird id als einziger Alias verwendet. Aliase müssen
            innerhalb des Workspace eindeutig sein.
        codingScheme:
          $ref: https://w3id.org/iqb/spec/coding-scheme/3.4
        items:
          $ref: '#/components/schemas/Items'
          description: Bei fehlender oder leerer Itemliste automatische Erzeugung nach itemMatrixRules.itemNaming;
            sonst explizites Mapping. Explizite Präfixbildung bleibt unitAlias + item.id ohne automatischen
            separator.
      required:
      - id
      - codingScheme
      additionalProperties: false
      description: Gemeinsames Format für Einzel- und Bulk-Upload. variableCodings.id muss innerhalb des Kodierschemas
        eindeutig sein; doppelte IDs sind semantisch INVALID_PARAMETER. Die Anzahl der definierten Variablen
        ist die stabile Grundlage für die automatische Einzelvariablenbenennung.
    BulkContentUpload:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Atomarer Upsert der angegebenen Definitionen. Ausgelassene Listen und Konfiguration bleiben
        unverändert. Keine Löschung nicht enthaltener Definitionen. Angegebene Listen sind nicht leer. configuration
        ersetzt die gesamte Konfiguration einschließlich Defaults.
      properties:
        units:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/UnitUpload'
        baseScales:
          type: array
          minItems: 1
          items:
            $ref: https://w3id.org/iqb/spec/acp-scale-base/0.4
        derivedScales:
          type: array
          minItems: 1
          items:
            $ref: https://w3id.org/iqb/spec/acp-scale-derived/0.4
        configuration:
          $ref: '#/components/schemas/WorkspaceConfiguration'
      example: *id001
    BulkContentUploadResult:
      type: object
      additionalProperties: false
      required:
      - units
      - baseScales
      - derivedScales
      - configurationUpdated
      properties:
        units:
          type: integer
          minimum: 0
          description: Anzahl übernommener Einträge im Request (neu oder ersetzt).
        baseScales:
          type: integer
          minimum: 0
          description: Anzahl übernommener Einträge im Request (neu oder ersetzt).
        derivedScales:
          type: integer
          minimum: 0
          description: Anzahl übernommener Einträge im Request (neu oder ersetzt).
        configurationUpdated:
          type: boolean
    ItemMatrixRules:
      $ref: https://w3id.org/iqb/spec/item-matrix-rules/0.1
      description: 'Unverändertes externes Format Item Matrix Rules 0.1. Laufzeitprofil der API: fehlende Felder
        werden gemäß Default der WorkspaceConfiguration ergänzt. PUT ersetzt statt zu mergen. missingsMap gilt
        nur für Status ungleich CODING_COMPLETE: genau einen passenden Eintrag verwenden, sonst missingElse.
        code und score kommen beide aus itemValue bzw. missingElse; fehlende Unterfelder erhalten code=0 und
        score=-99. Vorhandene Antwortcodes werden dabei nicht beibehalten. CODING_COMPLETE übernimmt ganzzahligen
        code und score unverändert; bei fehlenden/ungültigen Werten kein Ersatz durch missingElse oder Rohantwortwerte,
        sondern Kodierfehler. Status darf über alle Regeln hinweg nur einmal vorkommen, auch nicht doppelt
        in einer Regel; sonst INVALID_PARAMETER. Nur die fünf Statusnamen des externen Schemas sind konfigurierbar,
        andere Nicht-CODING_COMPLETE-Status benutzen missingElse. Für mean-v1 werden ausschließlich die in
        WorkspaceConfiguration.missingScores reservierten Item-Scores ausgeschlossen (Default [-99]). Andere
        negative Scores sowie 0 sind verwendbar, sofern sie nicht ausdrücklich reserviert wurden. Die Regel
        gilt für Zusatzitems und vollständig kodierte Antworten gleichermaßen; Skalenwerte sind davon nicht
        betroffen. Ein Mapping auf score=0 kann somit regulär als No-Credit-Wert mitzählen. Ein weiterer Missing-Score
        wie -98 muss explizit in missingScores aufgenommen werden.

        Automatische Itembenennung nur bei fehlender/leerer expliziter Itemliste: die feste Variablenmenge
        stammt aus variableCodings der gespeicherten Unit-Kodierdefinition, unabhängig von den übergebenen
        oder zurückgegebenen Antworten und deren Status. Jeder dort definierte Eintrag zählt, einschließlich
        abgeleiteter und manueller Variablen. Doppelte variableCodings.id werden beim Unit-Upload als INVALID_PARAMETER
        abgewiesen. Zuerst useUnitAliasIfSingleVariable: bei genau einem definierten Eintrag erhält nur dessen
        zugeordnete Antwort den unitAlias als Item-ID (Zuordnung über dessen alias, falls nicht leer, sonst
        id); sonst bei positiver Schwelle und strikt längerer Variablen-ID nur variableId; sonst unitAlias
        + separator + variableId. Länge in Unicode-Codepunkten. Schwelle 0 deaktiviert nur die Längenregel,
        nicht die Einzelvariablenregel. Negative Schwellen sind semantisch INVALID_PARAMETER. Alle Variablen
        bleiben Itemkandidaten. Namenskollisionen sind INVALID_PARAMETER. Explizite Items verwenden weiterhin
        useUnitAliasAsPrefix mit Default true und ohne automatischen separator. Die Laufzeitpräzisierungen
        ergänzen das externe Schema, ohne es zu erweitern.'
  responses:
    BadRequest:
      description: Ungültige Anfrageparameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INVALID_PARAMETER
            message: Ein Anfrageparameter ist ungültig.
    NotFound:
      description: Ressource nicht gefunden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: RESOURCE_NOT_FOUND
            message: Unit mit ID 12345 nicht gefunden
    InternalError:
      description: Interner Serverfehler
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: INTERNAL_ERROR
            message: Ein unerwarteter Fehler ist aufgetreten
