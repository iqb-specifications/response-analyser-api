x-open-design-points:
- Fachliche Bestätigung der Ablösung von codingParameters und separatem itemNaming durch Item Matrix Rules
  0.1 einschließlich geänderter Einzelvariablenregel und Ersatzcodes.
- Fachliche Bestätigung der API-Ergänzung missingScores (Default [-99]) und der stabilen Einzelvariablenzählung
  aus variableCodings. Regeln liefern vollständige Code/Score-Paare; negative Namensschwellen und mehrfache
  Statuszuordnungen werden abgewiesen.
- Abgrenzung von CODING_ERROR und Fehlerpriorität sowie subform-Auflösung bei mehrdeutigen Variablenreferenzen
  fachlich bestätigen.
- Betriebliche Grenze für die Request-Größe des synchronen Bulk-Uploads festlegen und dokumentieren.
